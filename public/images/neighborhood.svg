<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" fill="none" role="img" aria-label="Illustrated neighborhood of homes">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3e7cd"/><stop offset="1" stop-color="#faf7f1"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef1e9"/><stop offset="1" stop-color="#e6ebe0"/>
    </linearGradient>
  </defs>

  <!-- sky + ground -->
  <rect width="1200" height="440" fill="url(#sky)"/>
  <path d="M0 330 Q300 300 600 322 T1200 318 V440 H0 Z" fill="url(#ground)"/>
  <circle cx="1040" cy="96" r="46" fill="#c79a3b" opacity="0.35"/>
  <circle cx="1040" cy="96" r="30" fill="#c79a3b" opacity="0.5"/>

  <!-- distant tree left -->
  <g opacity="0.9">
    <rect x="86" y="286" width="10" height="46" rx="4" fill="#1d3a2d"/>
    <circle cx="91" cy="270" r="34" fill="#0e7c4f"/><circle cx="66" cy="286" r="24" fill="#0e7c4f"/><circle cx="116" cy="286" r="24" fill="#0e7c4f"/>
  </g>

  <!-- HOUSE 1 : craftsman, gable roof -->
  <g>
    <rect x="150" y="248" width="176" height="96" rx="4" fill="#faf7f1" stroke="#10231b" stroke-width="3"/>
    <path d="M138 250 L238 182 L338 250 Z" fill="#0e7c4f" stroke="#10231b" stroke-width="3" stroke-linejoin="round"/>
    <rect x="222" y="292" width="32" height="52" fill="#c79a3b" stroke="#10231b" stroke-width="3"/>
    <circle cx="247" cy="318" r="2.5" fill="#10231b"/>
    <rect x="170" y="272" width="34" height="34" fill="#f3e7cd" stroke="#10231b" stroke-width="3"/>
    <rect x="278" y="272" width="34" height="34" fill="#f3e7cd" stroke="#10231b" stroke-width="3"/>
    <path d="M187 272v34M170 289h34M295 272v34M278 289h34" stroke="#10231b" stroke-width="2"/>
  </g>

  <!-- HOUSE 2 : two-story, centerpiece, with SOLD sign -->
  <g>
    <rect x="470" y="206" width="220" height="138" rx="4" fill="#ffffff" stroke="#10231b" stroke-width="3.5"/>
    <path d="M456 208 L580 132 L704 208 Z" fill="#10231b"/>
    <rect x="546" y="286" width="40" height="58" fill="#c79a3b" stroke="#10231b" stroke-width="3"/>
    <circle cx="577" cy="316" r="3" fill="#10231b"/>
    <!-- lit windows (gold glow) -->
    <rect x="498" y="232" width="40" height="40" fill="#c79a3b" stroke="#10231b" stroke-width="3"/>
    <rect x="620" y="232" width="40" height="40" fill="#c79a3b" stroke="#10231b" stroke-width="3"/>
    <rect x="498" y="286" width="40" height="40" fill="#f3e7cd" stroke="#10231b" stroke-width="3"/>
    <rect x="620" y="286" width="40" height="40" fill="#f3e7cd" stroke="#10231b" stroke-width="3"/>
    <path d="M518 232v40M498 252h40M640 232v40M620 252h40M518 286v40M498 306h40M640 286v40M620 306h40" stroke="#10231b" stroke-width="2"/>
    <!-- SOLD sign -->
    <g>
      <rect x="404" y="290" width="8" height="54" fill="#1d3a2d"/>
      <rect x="360" y="286" width="80" height="34" rx="4" fill="#0e7c4f" stroke="#10231b" stroke-width="3"/>
      <text x="400" y="309" font-family="Georgia, serif" font-size="19" font-weight="700" fill="#faf7f1" text-anchor="middle">SOLD</text>
    </g>
  </g>

  <!-- tree between 2 and 3 -->
  <g>
    <rect x="738" y="276" width="12" height="56" rx="5" fill="#1d3a2d"/>
    <circle cx="744" cy="256" r="40" fill="#0e7c4f"/><circle cx="712" cy="276" r="26" fill="#0e7c4f"/><circle cx="776" cy="276" r="26" fill="#0e7c4f"/>
  </g>

  <!-- HOUSE 3 : bungalow, gold roof -->
  <g>
    <rect x="840" y="260" width="196" height="84" rx="4" fill="#faf7f1" stroke="#10231b" stroke-width="3"/>
    <path d="M826 262 L938 206 L1050 262 Z" fill="#c79a3b" stroke="#10231b" stroke-width="3" stroke-linejoin="round"/>
    <rect x="922" y="300" width="34" height="44" fill="#1d3a2d" stroke="#10231b" stroke-width="3"/>
    <rect x="858" y="282" width="38" height="30" fill="#f3e7cd" stroke="#10231b" stroke-width="3"/>
    <rect x="980" y="282" width="38" height="30" fill="#f3e7cd" stroke="#10231b" stroke-width="3"/>
    <path d="M877 282v30M858 297h38M999 282v30M980 297h38" stroke="#10231b" stroke-width="2"/>
  </g>

  <!-- foreground path + shrubs -->
  <path d="M540 344 q30 40 0 96 h60 q-30 -56 0 -96 Z" fill="#e6ebe0"/>
  <circle cx="360" cy="344" r="16" fill="#0e7c4f" opacity="0.85"/>
  <circle cx="392" cy="346" r="12" fill="#0e7c4f" opacity="0.7"/>
  <circle cx="1096" cy="344" r="18" fill="#0e7c4f" opacity="0.8"/>
</svg>
